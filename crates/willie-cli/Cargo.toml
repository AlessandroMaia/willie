[package]
name = "willie-cli"
description = "Stateless command-line client used inside the distro (attach, doctor)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "willie"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
willie-core = { workspace = true }
willie-linux = { workspace = true }
willie-proto = { workspace = true }

# Raw mode, signals and `TIOCGWINSZ` for `willie attach`; Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
