# Per-distribution settings of the Willie distribution (read by WSL).
[boot]
systemd = false
# /run is a fresh tmpfs on every boot; the daemon runs unprivileged and
# needs its socket directory to exist.
command = install -d -o willie -g willie -m 0750 /run/willie

[automount]
enabled = true
options = "metadata"

[interop]
enabled = true
appendWindowsPath = false

[network]
generateResolvConf = true

[user]
default = willie

[gpu]
enabled = false

[time]
useWindowsTimezone = true
