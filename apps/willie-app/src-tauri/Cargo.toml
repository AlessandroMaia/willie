[package]
name = "willie-app"
description = "Willie desktop application (Tauri 2). Hosts the UI, the tray and the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Distinct from the binary name so the two artifacts never collide on
# Windows.
name = "willie_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
willie-core = { workspace = true }
willie-engine = { workspace = true }
willie-proto = { workspace = true }

[lints]
workspace = true
