# pnpm settings for the frontend package (pnpm >= 10 reads them from here).

# Dependency build scripts are blocked unless listed. esbuild needs its
# postinstall to place the platform binary; nothing else may run scripts.
allowBuilds:
  esbuild: true

# Pins a transitive dependency to the previous release: some networks
# refuse tarballs published in the last days, and the newest release of
# this package is one of them. Remove the pin once it is reachable.
overrides:
  baseline-browser-mapping: 2.11.18
